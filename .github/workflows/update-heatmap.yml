name: Update contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install fonttools brotli

      - run: python tools/build_assets.py --dynamic

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-light.svg assets/heatmap-dark.svg \
            assets/cards/stacked-library-light.svg assets/cards/stacked-library-dark.svg \
            assets/cards/little-cats-light.svg assets/cards/little-cats-dark.svg \
            assets/cards/highlightr-light.svg assets/cards/highlightr-dark.svg
          git diff --cached --quiet || git commit -m "chore: update profile activity"
          git push
